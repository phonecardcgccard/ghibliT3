<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Studio Ghibli AI Image Generator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.3/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body {
      background: #e9f5e9 url('https://i.ibb.co/0q5q8gF/ghibli-bg.jpg') no-repeat center/cover;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center p-6 text-green-900 text-center">

  <div class="max-w-xl w-full bg-white bg-opacity-80 p-6 rounded-xl shadow-lg">
    <img src="https://i.ibb.co/fxVPqd0/ghibli-icon.png" alt="Ghibli Icon" class="w-20 mx-auto mb-4">
    <h1 class="text-4xl font-bold mb-2 drop-shadow">Studio Ghibli AI Image Generator</h1>
    <p class="text-green-700 mb-6">
      Enter a description and create a magical image in Studio Ghibli style — free & watermark-free!
    </p>

    <input id="prompt-input" type="text" placeholder="A quiet forest with a little spirit..."
      class="w-full p-3 border border-green-300 rounded mb-4">
    <button onclick="generateImage()"
      class="bg-green-500 text-white px-6 py-2 rounded hover:bg-green-600 transition mb-2">
      Generate Image
    </button>

    <p id="loading" class="mt-4 hidden">🎨 Generating your Ghibli world...</p>

    <div id="result" class="mt-6 hidden">
      <img id="result-img" src="" alt="Generated Result" class="rounded-lg shadow-lg mb-3 max-w-full">
      <a id="download-link" href="#" download="ghibli-image.png" class="underline text-green-800">Download Image</a>
    </div>
  </div>

  <script>
    function generateImage() {
      const promptInput = document.getElementById('prompt-input');
      const prompt = promptInput.value.trim();
      if (!prompt) {
        alert("Please enter a description!");
        return;
      }

      const loading = document.getElementById('loading');
      const resultDiv = document.getElementById('result');
      const resultImg = document.getElementById('result-img');
      const downloadLink = document.getElementById('download-link');

      loading.classList.remove('hidden');
      resultDiv.classList.add('hidden');

      const apiUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?noLogo=true`;

      setTimeout(() => {
        resultImg.src = apiUrl;
        resultImg.onload = () => {
          loading.classList.add('hidden');
          resultDiv.classList.remove('hidden');
          downloadLink.href = apiUrl;
        };
      }, 500);
    }
  </script>

</body>
</html>
